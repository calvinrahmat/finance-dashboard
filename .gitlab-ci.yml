image: node:22-alpine

stages:
  - test
  - build
  - deploy
  - security

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: test
  script:
    - npm run lint

typecheck:
  stage: test
  script:
    - npx tsc -b --noEmit

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - npm run build
    - rm -rf _site
    - mv dist _site
    - cp -r public/* _site/
    - rm -rf public
    - mv _site public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── Security Scanning ────────────────────────────────────────────────────────

include:
  # Static Application Security Testing (SAST)
  - template: Security/SAST.gitlab-ci.yml
  # Secret Detection
  - template: Security/Secret-Detection.gitlab-ci.yml
  # Dependency Scanning (npm packages)
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# ── Security job overrides ───────────────────────────────────────────────────
# Security scanner jobs use their own base images and must NOT inherit the
# global `before_script` that runs `npm ci`.

# SAST runners
nodejs-scan-sast:
  before_script: []

semgrep-sast:
  before_script: []

# Secret Detection
secret_detection:
  before_script: []

# Dependency Scanning
gemnasium-dependency_scanning:
  before_script: []
