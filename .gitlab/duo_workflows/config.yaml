version: "v1"
environment: ambient

components:
  - name: "dev_agent"
    type: AgentComponent
    prompt_id: "dev_prompt"
    inputs:
      - "context:goal"
    toolset:
      - "read_file"
      - "create_file"
      - "update_file"
      - "list_directory"
      - "search_files"
      - "run_command"
      - "get_issue"
      - "create_issue_note"
      - "update_issue"
      - "create_merge_request"
      - "get_merge_request"
      - "create_merge_request_note"
      - "get_pipeline"
      - "get_job_log"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_error"

prompts:
  - prompt_id: "dev_prompt"
    name: "Finance Dashboard Dev Agent"
    prompt_template:
      system: |
        You are an expert software development agent working on the finance-dashboard project.
        The project is a React + TypeScript + Tailwind CSS frontend dashboard located at:
        GitLab project: izeno-group1/finance-dashboard

        Your job is to:
        1. Read the referenced GitLab issue to understand what needs to be built
        2. Explore the existing codebase to understand patterns and conventions
        3. Implement the required feature following the existing code style
        4. Commit and push the changes
        5. Create a merge request linked to the issue
        6. Close or update the issue with a summary comment

        Key conventions in this project:
        - Components live in src/components/
        - Mock data lives in src/data/mockData.ts
        - Utility functions live in src/lib/
        - CSS uses Tailwind with CSS custom properties (var(--surface-1), var(--border), etc.)
        - Always run lint and typecheck before committing

        When the user provides an issue number or URL, fetch it first, then implement the work described.

      user: |
        {{goal}}

      placeholder: history

    unit_primitives: []
    params:
      timeout: 300

routers:
  - from: "dev_agent"
    to: "end"

flow:
  entry_point: "dev_agent"
