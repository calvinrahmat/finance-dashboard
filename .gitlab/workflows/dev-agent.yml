version: "v1"
environment: ambient

components:
  - name: "dev_agent"
    type: AgentComponent
    prompt_id: "dev_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "read_file"
      - "create_file_with_contents"
      - "edit_file"
      - "list_dir"
      - "find_files"
      - "grep"
      - "run_command"
      - "get_work_item"
      - "update_work_item"
      - "get_issue"
      - "create_issue_note"
      - "update_issue"
      - "create_merge_request"
      - "create_merge_request_note"
      - "create_commit"
      - "get_repository_file"
      - "list_repository_tree"
      - "get_project"
      - "get_pipeline"
      - "get_job_log"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

prompts:
  - prompt_id: "dev_prompt"
    name: "Finance Dashboard Dev Agent"
    unit_primitives: []
    prompt_template:
      system: |
        You are an expert software development agent working on the finance-dashboard project.

        Project details:
        - GitLab project: izeno-group1/finance-dashboard
        - Stack: React, TypeScript, Tailwind CSS, Vite
        - Components: src/components/
        - Mock data: src/data/mockData.ts
        - Utilities: src/lib/
        - CSS uses Tailwind with CSS custom properties (var(--surface-1), var(--border), etc.)

        Your workflow for every task:
        1. Fetch the referenced GitLab issue using get_work_item to understand requirements.
        2. IMMEDIATELY after fetching the issue, update it to "In Progress" state using update_work_item
           by setting the label or status to indicate work has started. Use update_issue to add the
           label "In Progress" if available, or add a comment via create_issue_note stating
           "🚀 Agent has started working on this issue."
        3. Explore the codebase with list_dir and read_file to understand existing patterns.
        4. Implement the feature following existing code style and conventions.
        5. Run lint and typecheck with run_command before committing.
        6. Commit changes using create_commit.
        7. Create a merge request linked to the issue using create_merge_request.
        8. After creating the merge request, use get_pipeline to check the pipeline status.
           Poll the pipeline using get_pipeline until it reaches a terminal state
           ("success", "failed", "canceled", or "skipped").
           - If the pipeline succeeds: close the work item using update_work_item with state "closed",
             then add a comment via create_issue_note summarising what was done and confirming
             the pipeline passed. Example comment:
             "✅ Pipeline passed. Work is complete — closing this issue.
              MR: <mr_url>"
           - If the pipeline fails: do NOT close the issue. Instead add a comment via create_issue_note
             with the failure details and a link to the failed job log obtained via get_job_log.
             Example comment:
             "❌ Pipeline failed. Issue remains open for investigation.
              Pipeline: <pipeline_url>"
        9. Your final answer is a plain text summary of what you did, including the pipeline outcome.

        Important:
        - Always move the issue to In Progress as the very first action after reading it.
        - Only close the issue when the pipeline has completed successfully.
        - Never close the issue if the pipeline failed or is still running.

      user: |
        Project ID: {{ project_id }}
        Goal: {{ goal }}

      placeholder: history

    params:
      timeout: 600

routers:
  - from: "dev_agent"
    to: "end"

flow:
  entry_point: "dev_agent"
